name: Publish release draft

on:
  push:
    tags:
      - 'v[0-9]*'

permissions:
  contents: write
  actions: read

jobs:
  version:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify tag and application versions
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: node scripts/check-release-version.mjs "$RELEASE_TAG"
      - name: Require successful preparation on main for this commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          gh api -X GET "repos/${{ github.repository }}/actions/workflows/prepare-release.yml/runs" \
            -f head_sha="$COMMIT_SHA" -f branch=main -f event=push -f status=success \
            --jq '.workflow_runs | any(.head_sha == env.COMMIT_SHA and .conclusion == "success")' \
            | grep -qx true

  publish:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            bundles: deb
          - os: windows-latest
            bundles: nsis
          - os: macos-latest
            bundles: dmg
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'
      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xdg-utils
      - run: npm ci
      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: EnvEdit ${{ github.ref_name }}
          releaseBody: |
            Version Linux à vérifier avant publication.
            Installateurs Windows et macOS expérimentaux : validation fonctionnelle différée.
          releaseDraft: true
          prerelease: false
          args: --bundles ${{ matrix.bundles }}
