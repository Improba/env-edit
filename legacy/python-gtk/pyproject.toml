[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "envedit"
version = "0.1.0"
description = "Editeur GTK non destructif de fichiers .env"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
test = ["pytest>=7"]

[project.scripts]
envedit = "envedit.app:main"

[tool.setuptools.packages.find]
include = ["envedit*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
